aid: ethena-labs
name: Ethena Labs
description: 'Ethena Labs is the crypto-native protocol behind USDe, a synthetic dollar backed
  by spot crypto assets, onchain custody, and delta-neutral hedging positions on centralized
  liquidity venues, alongside the staked savings instrument sUSDe (the "Internet Bond"), the
  governance token ENA, and USDtb. Ethena exposes a public Minting API for whitelisted institutional
  participants to mint and redeem USDe: a request-for-quote (RFQ) flow returns firm 15-minute
  quotes that are signed with EIP-712 (or EIP-1271 for smart-contract wallets) and submitted onchain.
  This profile was surfaced as a portfolio company of Ribbit Capital and enriched with the real
  developer surface documented at docs.ethena.fi.'
