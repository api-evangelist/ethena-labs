apis:
- name: Ethena Minting API
  description: 'Public request-for-quote (RFQ) minting and redemption API for USDe. Whitelisted
    participants check asset availability, request a firm 15-minute quote, fetch the fee schedule,
    sign the order with EIP-712 / EIP-1271, submit it onchain, and poll for order confirmation.
    Access is gated by IP whitelisting and onchain wallet-address whitelisting.'
